services:
  # ===== PostgreSQL =====
  postgres:
    image: postgres:17-alpine
    container_name: mcxx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-mcxx_chat}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-mcxx_chat}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== Redis =====
  redis:
    image: redis:7-alpine
    container_name: mcxx-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass "${REDIS_PASSWORD:-}"
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== Spring Boot App =====
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcxx-chat-app
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      # Server
      SERVER_PORT: 8080
      # Database - connect to postgres service
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-mcxx_chat}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      # Redis - connect to redis service
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # Logging
      SHOW_SQL: ${SHOW_SQL:-false}
      LOG_LEVEL_SECURITY: ${LOG_LEVEL_SECURITY:-WARN}
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXP_SECONDS: ${JWT_ACCESS_EXP_SECONDS:-3600}
      JWT_REFRESH_EXP_SECONDS: ${JWT_REFRESH_EXP_SECONDS:-604800}
      # AWS S3
      AWS_S3_REGION: ${AWS_S3_REGION}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME}
      AWS_S3_ACCESS_KEY: ${AWS_S3_ACCESS_KEY}
      AWS_S3_SECRET_KEY: ${AWS_S3_SECRET_KEY}
      AWS_S3_ENDPOINT_OVERRIDE: ${AWS_S3_ENDPOINT_OVERRIDE:-}
      AWS_S3_MAX_FILE_SIZE: ${AWS_S3_MAX_FILE_SIZE:-5242880}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
