spring.application.name=mcxx-chat

# ===== Server =====
server.port=${SERVER_PORT:8080}

# ===== PostgreSQL (datasource) =====
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mcxx_chat}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# ===== Flyway =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.repair-on-migrate=true
spring.flyway.validate-on-migrate=false

# ===== Redis =====
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# ===== Logging =====
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:DEBUG}

# ===== JWT =====
jwt.secret=${JWT_SECRET:dev-only-jwt-secret-change-me-please-32-bytes-minimum}
jwt.access-exp-seconds=${JWT_ACCESS_EXP_SECONDS:3600}
jwt.refresh-exp-seconds=${JWT_REFRESH_EXP_SECONDS:604800}

