spring.application.name=mcxx-chat

# ===== Server =====
server.port=8080

# ===== PostgreSQL (datasource) =====

spring.datasource.url=jdbc:postgresql://localhost:5432/mcxx_chat
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== Flyway =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ===== Redis =====
spring.data.redis.host=localhost
spring.data.redis.port=6379
# spring.data.redis.password=${REDIS_PASSWORD:}

# ===== Logging =====
logging.level.org.springframework.security=DEBUG

# ===== JWT =====
jwt.secret=${JWT_SECRET:dev-only-jwt-secret-change-me-please-32-bytes-minimum}
jwt.access-exp-seconds=3600
jwt.refresh-exp-seconds=604800
